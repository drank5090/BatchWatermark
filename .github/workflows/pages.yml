name: Deploy Web Edition to GitHub Pages

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Upload web/ artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Inject CI-managed analytics, AdSense tags & ads.txt
        env:
          GTM_CONTAINER_ID: ${{ secrets.GTM_CONTAINER_ID }}
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          ADSENSE_ADS_TXT: ${{ secrets.ADSENSE_ADS_TXT }}
        run: python scripts/inject_site_tags.py --web-dir web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
