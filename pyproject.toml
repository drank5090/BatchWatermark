[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "batch-watermark"
version = "1.1.0"
description = "基于 Python + PySide6 + Pillow + FFmpeg 的桌面端批量图片与视频水印工具，支持实时多图预览、横竖版隔离、自定义预设本机保存与导入导出"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "drank5090" },
]
keywords = [
    "watermark",
    "batch-watermark",
    "image-processing",
    "video-watermark",
    "pyside6",
    "pillow",
    "ffmpeg",
    "desktop-app",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "imageio-ffmpeg>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/drank5090/BatchWatermark"
Repository = "https://github.com/drank5090/BatchWatermark"
Issues = "https://github.com/drank5090/BatchWatermark/issues"

[project.scripts]
batch-watermark = "batch_watermark.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["batch_watermark"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
