<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 Page Not Found | BatchWatermark</title>
  <meta name="description" content="Page not found. Return to BatchWatermark to watermark images and videos locally in your browser." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#1e2128" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="./favicon.ico" sizes="48x48" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 70% 20%, #1b2a47 0%, #16181d 55%);
      color: #e5e7eb;
      font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    main {
      max-width: 560px;
      width: 100%;
      text-align: center;
      background: #1e2128;
      border: 1px solid #2c313c;
      border-radius: 14px;
      padding: 36px 28px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    img { width: 72px; height: 72px; }
    .code { margin: 14px 0 4px; font-size: 56px; font-weight: 800; color: #93c5fd; letter-spacing: 2px; }
    h1 { margin: 0 0 10px; font-size: 20px; color: #f9fafb; }
    p { margin: 0 0 20px; color: #9ca3af; line-height: 1.7; font-size: 14px; }
    nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
    a {
      display: inline-block;
      padding: 9px 15px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid #383f4e;
      color: #e5e7eb;
      background: #2a2f3a;
    }
    a:hover { background: #343b49; }
    a.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    a.primary:hover { background: #2563eb; }
  </style>
</head>
<body>
  <main>
    <img id="iconImg" src="./favicon.svg" alt="BatchWatermark" width="72" height="72" />
    <div class="code" aria-hidden="true">404</div>
    <h1>页面未找到 · Page Not Found</h1>
    <p>您访问的地址不存在或已被移动，请选择语言返回 BatchWatermark 首页。<br />The requested page was not found. Choose your language below.</p>
    <nav aria-label="Language homepages">
      <a id="linkZh" class="primary" href="./" hreflang="zh-CN">简体中文</a>
      <a id="linkEn" href="./en/" hreflang="en">English</a>
      <a id="linkJa" href="./ja/" hreflang="ja">日本語</a>
      <a id="linkHant" href="./zh-hant/" hreflang="zh-Hant">繁體中文</a>
    </nav>
    <nav aria-label="External links">
      <a href="https://watermark.zak-cloud.top/" rel="noopener">watermark.zak-cloud.top</a>
      <a href="https://github.com/drank5090/BatchWatermark" rel="noopener">GitHub</a>
    </nav>
  </main>
  <script>
    (function () {
      var base = location.pathname.indexOf("/BatchWatermark/") === 0 ? "/BatchWatermark/" : "/";
      document.getElementById("linkZh").setAttribute("href", base);
      document.getElementById("linkEn").setAttribute("href", base + "en/");
      document.getElementById("linkJa").setAttribute("href", base + "ja/");
      document.getElementById("linkHant").setAttribute("href", base + "zh-hant/");
      document.getElementById("iconImg").setAttribute("src", base + "favicon.svg");
    })();
  </script>
</body>
</html>
